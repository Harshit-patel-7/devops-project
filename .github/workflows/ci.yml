name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE: ghcr.io/harshit-patel-7/task-manager

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push the image
        if: github.event_name == 'push'
        run: |
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
  deploy-test:
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Create a temporary Kubernetes cluster
        uses: helm/kind-action@v1

      - name: Create the database password Secret
        run: kubectl create secret generic postgres-secret --from-literal=password=$(openssl rand -hex 12)

      - name: Deploy the database and the app
        run: |
          kubectl apply -f k8s/
          kubectl rollout status statefulset/postgres --timeout=180s
          kubectl set image deployment/task-manager task-manager=$IMAGE:${{ github.sha }}
          kubectl rollout status deployment/task-manager --timeout=180s

      - name: Smoke test the running app
        run: |
          kubectl port-forward service/task-manager-service 8080:8080 &
          sleep 5
          curl --fail --retry 5 --retry-delay 3 --retry-connrefused http://localhost:8080/health
          curl --fail http://localhost:8080/ready
          curl --fail -X POST -H "Content-Type: application/json" -d '{"title":"CI smoke test"}' http://localhost:8080/api/tasks
          curl --fail http://localhost:8080/api/stats

      - name: Show cluster details if something failed
        if: failure()
        run: |
          kubectl get pods
          kubectl describe pods
          kubectl logs deployment/task-manager --all-containers=true